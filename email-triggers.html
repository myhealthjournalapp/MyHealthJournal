og export generated.", "type": "Routine", "variables": ["name", "email", "timestamp"]}, {"code": "DATA_IMPORTED", "name": "Data Imported", "subject": "My Health Journal — Data Imported", "trigger": "Validated backup file merged into account.", "type": "Routine", "variables": ["name", "importedName", "importedEmail", "importedRecoveryEmail", "importedPhone", "readingsCount", "avatarImported", "settingsImported", "backupVersion", "backupExportedAt", "timestamp"]}, {"code": "GOOGLE_DRIVE_CONNECTED", "name": "Google Drive Connected", "subject": "My Health Journal — Google Drive Connected", "trigger": "User connected their Google Drive.", "type": "Routine", "variables": ["name", "driveEmail", "timestamp"]}, {"code": "MEDICAL_RECORD_ADDED", "name": "Medical Record Added", "subject": "My Health Journal — Medical Record Added", "trigger": "A PDF was uploaded to Medical Records.", "type": "Routine", "variables": ["name", "recordTitle", "recordSize", "recordUploadedAt"]}, {"code": "MEDICAL_RECORD_REMOVED", "name": "Medical Record Removed", "subject": "My Health Journal — Medical Record Removed", "trigger": "A PDF was deleted from Medical Records.", "type": "Routine", "variables": ["name", "recordTitle", "recordRemovedAt"]}, {"code": "DAILY_SUMMARY", "name": "Daily Summary", "subject": "My Health Journal — Daily Summary", "trigger": "09:00 UTC the following day, when enabled.", "type": "Routine", "variables": ["name", "periodLabel", "bpAvg", "bpHigh", "bpLow", "bpClass", "pulseAvg", "pulseHigh", "pulseLow", "pulseClass", "fastingAvg", "fastingClass", "preMealAvg", "preMealClass", "postMealAvg", "postMealClass", "bedtimeAvg", "bedtimeClass", "randomAvg", "randomClass", "totalReadings", "overallScore"]}, {"code": "WEEKLY_SUMMARY", "name": "Weekly Summary", "subject": "My Health Journal — Weekly Summary", "trigger": "Monday 09:00 UTC when enabled.", "type": "Routine", "variables": ["name", "periodLabel", "bpAvg", "bpHigh", "bpLow", "bpClass", "pulseAvg", "pulseHigh", "pulseLow", document.getElementById('count').textContent=templates.length+' automated emails';
const list=document.getElementById('list');
templates.forEach((t,i)=>{const row=document.createElement('article'); const heading=document.createElement('strong');heading.textContent=(i+1)+'. '+t.name;row.append(heading);const badge=document.createElement('span');badge.className='type '+(t.type==='Routine'?'routine':'critical');badge.textContent=t.type;row.append(badge);for(const [label,text] of [['Subject',t.subject],['Trigger',t.trigger],['Code',t.code],['Variables',t.variables.map(v=>'{{'+v+'}}').join(', ')||'none']]){const p=document.createElement('p');const key=document.createElement('b');key.textContent=label+': ';p.append(key,document.createTextNode(text));row.append(p);}list.append(row);});
